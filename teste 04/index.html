<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Velha - Matrizes</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        #tabuleiro-visual { 
            display: grid; 
            grid-template-columns: repeat(3, 100px); /* 3 colunas de 100px */
            gap: 5px; 
            justify-content: center; 
        }
        .celula { 
            width: 100px; height: 100px; 
            background-color: #eee; 
            font-size: 3em; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; 
        }
        .celula:hover { background-color: #ddd; }
    </style>
</head>
<body>

    <h1>Jogo da Velha</h1>
    <h2 id="mensagem">Vez do jogador: X</h2>

    <div id="tabuleiro-visual">
        <div class="celula" onclick="fazerJogada(0, 0)"></div>
        <div class="celula" onclick="fazerJogada(0, 1)"></div>
        <div class="celula" onclick="fazerJogada(0, 2)"></div>
        
        <div class="celula" onclick="fazerJogada(1, 0)"></div>
        <div class="celula" onclick="fazerJogada(1, 1)"></div>
        <div class="celula" onclick="fazerJogada(1, 2)"></div>
        
        <div class="celula" onclick="fazerJogada(2, 0)"></div>
        <div class="celula" onclick="fazerJogada(2, 1)"></div>
        <div class="celula" onclick="fazerJogada(2, 2)"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
